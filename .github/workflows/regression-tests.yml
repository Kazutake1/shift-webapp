name: Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: Install browser test tools
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Browser operation tests
        env:
          CAPTURE_PRINT_PDF: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: npm run test:e2e
      - name: Upload PDF preview for visual review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ipad-print-preview
          path: test-results/**/ipad-print-preview.png
