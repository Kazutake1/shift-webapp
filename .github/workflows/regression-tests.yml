name: Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked tools
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Regression tests
        run: npm test
      - name: Cloudflare Pages build
        run: npm run build:cloudflare
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Browser operation tests
        run: npm run test:e2e
      - name: Service Worker E2E
        run: npm run test:sw
