name: Update official Japanese holidays

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'scripts/update-holidays.mjs'
  schedule:
    # 毎月20日 12:27（日本時間）。定時付近の混雑を避ける。
    - cron: '27 3 20 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: shift-webapp-holidays
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch published holidays
        run: |
          curl --fail --location --show-error --silent --retry 3 --max-time 45 \
            https://www8.cao.go.jp/chosei/shukujitsu/syukujitsu.csv \
            --output "$RUNNER_TEMP/syukujitsu.csv"
      - name: Update published holidays
        id: holidays
        run: |
          node scripts/update-holidays.mjs "$RUNNER_TEMP/syukujitsu.csv"
          if git diff --quiet -- holidays.js sw.js; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Syntax check
        if: steps.holidays.outputs.changed == 'true'
        run: npm run check
      - name: Regression tests
        if: steps.holidays.outputs.changed == 'true'
        run: npm test
      - name: Install browser test tools
        if: steps.holidays.outputs.changed == 'true'
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Browser operation tests
        if: steps.holidays.outputs.changed == 'true'
        run: npm run test:e2e
      - name: Commit verified holiday updates
        if: steps.holidays.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add holidays.js sw.js
          git commit -m 'Update official Japanese holidays'
          git push origin HEAD:main
      - name: Request GitHub Pages build
        if: steps.holidays.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --show-error --silent --retry 3 \
            -X POST -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds" \
            --output "$RUNNER_TEMP/pages-build.json"
          for attempt in $(seq 1 30); do
            status=$(curl --fail --location --show-error --silent \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds/latest" | jq -r '.status')
            if [ "$status" = built ]; then echo 'GitHub Pages build succeeded'; exit 0; fi
            if [ "$status" = errored ]; then echo 'GitHub Pages build failed'; exit 1; fi
            sleep 10
          done
          echo 'GitHub Pages build timed out'
          exit 1
