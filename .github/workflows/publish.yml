name: Update official Japanese holidays

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'scripts/update-holidays.mjs'
  schedule:
    # 毎月20日 12:27（日本時間）。定時付近の混雑を避ける。
    - cron: '27 3 20 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shift-webapp-holidays
  cancel-in-progress: false

jobs:
  update:
    outputs:
      changed: ${{ steps.holidays.outputs.changed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Fetch published holidays
        run: |
          curl --fail --location --show-error --silent --retry 3 --max-time 45 \
            https://www8.cao.go.jp/chosei/shukujitsu/syukujitsu.csv \
            --output "$RUNNER_TEMP/syukujitsu.csv"
      - name: Update published holidays
        id: holidays
        run: |
          node scripts/update-holidays.mjs "$RUNNER_TEMP/syukujitsu.csv"
          if git diff --quiet -- holidays.js sw.js; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install locked tools
        if: steps.holidays.outputs.changed == 'true'
        run: npm ci --ignore-scripts
      - name: Syntax check
        if: steps.holidays.outputs.changed == 'true'
        run: npm run check
      - name: Lint
        if: steps.holidays.outputs.changed == 'true'
        run: npm run lint
      - name: Regression tests
        if: steps.holidays.outputs.changed == 'true'
        run: npm test
      - name: Static Pages build
        if: steps.holidays.outputs.changed == 'true'
        run: npm run build:cloudflare
      - name: Install browser engines
        if: steps.holidays.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Browser operation tests
        if: steps.holidays.outputs.changed == 'true'
        run: npm run test:e2e
      - name: Service Worker E2E
        if: steps.holidays.outputs.changed == 'true'
        run: npm run test:sw
      - name: Commit verified holiday updates
        if: steps.holidays.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add holidays.js sw.js
          git commit -m 'Update official Japanese holidays'
          git push origin HEAD:main
      - name: Configure GitHub Pages
        if: steps.holidays.outputs.changed == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload GitHub Pages artifact
        if: steps.holidays.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: needs.update.outputs.changed == 'true'
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
