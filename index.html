<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#193f58"><meta name="apple-mobile-web-app-capable" content="yes"><title>シフト作成</title><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body><header class="appbar no-print"><div class="brand"><select id="store" aria-label="店舗を切り替え"></select></div><nav><button id="preview">印刷プレビュー</button><button id="settings" aria-label="設定" title="設定"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 3-.6 2.2-1.6.9-2.2-.6-3 5.1 1.7 1.6v1.8l-1.7 1.6 3 5.1 2.2-.6 1.6.9L9 23h6l.6-2.2 1.6-.9 2.2.6 3-5.1-1.7-1.6V12l1.7-1.6-3-5.1-2.2.6-1.6-.9L15 3Z" transform="translate(1 0) scale(.92)"/><circle cx="12" cy="12" r="3.2"/></svg></button></nav></header><main id="shift-page"><section id="birthday-notices" class="no-print" aria-label="誕生日のお知らせ" aria-live="polite" hidden></section><section class="controls no-print"><div class="week-nav"><button id="prev" aria-label="前週">‹ 前週</button><strong id="week-label"></strong><button id="next" aria-label="次週">次週 ›</button><button id="today">今週へ戻る</button></div><div class="store-control"><button data-undo disabled aria-label="直前の操作を取り消す" title="直前の操作を取り消す" class="undo-button"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M11 3 2 10l9 7V12h10a7 7 0 0 1 0 14H5v4h16a11 11 0 0 0 0-22H11Z" fill="currentColor"/></svg></button></div></section><div id="notice" class="no-print" role="status"></div><section id="paper"><div class="paper-header"><strong id="store-name"></strong><span id="paper-period"></span></div><div class="table-scroll"><table id="schedule" aria-label="週間シフト表"></table></div></section><div id="save-status" class="save-status no-print" hidden><span id="saved" role="status"></span></div></main><section id="settings-page" class="no-print" hidden><div class="settings-heading"><h1>設定</h1><button id="settings-back">シフト表に戻る</button></div><p id="settings-store"></p><p id="offline-status" class="hint" role="status">通信がないときの起動準備を確認しています。</p><p class="hint">誕生日のお知らせ：全店舗の表示中の従業員が対象です。入社1年以上で、誕生日の7日前から当日まで表示します。2月29日は平年には2月28日として扱います。</p><p id="backup-date" role="status"></p><button data-undo disabled aria-label="直前の操作を取り消す" title="直前の操作を取り消す" class="undo-button"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M11 3 2 10l9 7V12h10a7 7 0 0 1 0 14H5v4h16a11 11 0 0 0 0-22H11Z" fill="currentColor"/></svg></button><p class="hint">取り消しは直前の1回です。週・店舗の切り替え、再読み込み、バックアップ復元で取り消し履歴はリセットされます。</p><div class="settings-menu"><button id="stores">店舗管理</button><button id="backup">バックアップ</button><button id="employees">従業員管理</button><button id="fixed">固定作業設定</button></div></section><dialog id="editor"><div class="dialog-top"><h2 id="dialog-title"></h2><button id="close" aria-label="閉じる">×</button></div><div id="dialog-body"></div></dialog><script type="module" src="app.js"></script></body></html>
