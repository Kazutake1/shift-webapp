name: Verify and publish app

on:
  push:
    branches: [main]
  schedule:
    # 毎月20日 12:27（日本時間）。定時付近の混雑を避ける。
    - cron: '27 3 20 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shift-webapp-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      holiday_changed: ${{ steps.holidays.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch published holidays
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          curl --fail --location --show-error --silent --retry 3 --max-time 45 \
            https://www8.cao.go.jp/chosei/shukujitsu/syukujitsu.csv \
            --output "$RUNNER_TEMP/syukujitsu.csv"
      - name: Update published holidays
        id: holidays
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node scripts/update-holidays.mjs "$RUNNER_TEMP/syukujitsu.csv"
          if git diff --quiet -- holidays.js sw.js; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Syntax check
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: Install browser test tools
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Browser operation tests
        run: npm run test:e2e
      - name: Commit verified holiday updates
        if: steps.holidays.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add holidays.js sw.js
          git commit -m 'Update official Japanese holidays'
          git push origin HEAD:main
      - name: Prepare Pages files
        if: github.event_name == 'push' || steps.holidays.outputs.changed == 'true'
        run: |
          mkdir site
          cp index.html style.css *.js *.png *.svg manifest.webmanifest site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' || steps.holidays.outputs.changed == 'true'
        with:
          path: site

  deploy:
    if: github.event_name == 'push' || needs.verify.outputs.holiday_changed == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified app
        id: deployment
        uses: actions/deploy-pages@v4
